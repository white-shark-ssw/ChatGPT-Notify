name: Bark notification

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  bark:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Build Bark payload
        id: prepare
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          marker = "[BARK_NOTIFY_V1]"
          icon_url = "https://images.ctfassets.net/j22is2dtoxu1/intercom-img-d177d076c9a5453052925143/49d5d812b0a6fcc20a14faa8c629d9fb/icon-ios-1024_401x.png"
          bark_group = "ChatGPT-Notify"
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          issue = event.get("issue") or {}
          comment = event.get("comment") or {}
          raw = str(comment.get("body") or "")

          should_notify = issue.get("number") == 1 and bool(issue.get("pull_request")) and raw.startswith(marker)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"notify={'true' if should_notify else 'false'}\n")

          if not should_notify:
              print("Comment is not a Bark notification event; skipping.")
              raise SystemExit(0)

          bark_key = os.environ.get("BARK_KEY", "").strip()
          if not bark_key:
              raise SystemExit("BARK_KEY secret is missing")

          lines = raw.splitlines()
          if not lines or lines[0].strip() != marker:
              raise SystemExit("Invalid notification marker")

          json_text = "\n".join(lines[1:]).strip()
          if not json_text:
              raise SystemExit("Missing JSON payload")

          data = json.loads(json_text)
          if not isinstance(data, dict):
              raise SystemExit("Payload must be a JSON object")

          allowed = {"project", "title", "body", "group", "url"}
          unknown = set(data) - allowed
          if unknown:
              raise SystemExit(f"Unknown fields: {sorted(unknown)}")

          project = str(data.get("project", "")).strip()
          body = str(data.get("body", "")).strip()
          title = str(data.get("title", "")).strip() or project
          url = str(data.get("url", "")).strip()

          if not project:
              raise SystemExit("project is required")
          if not body:
              raise SystemExit("body is required")

          limits = {"project": (project, 80), "title": (title, 120), "body": (body, 500), "url": (url, 1000)}
          for name, (value, limit) in limits.items():
              if len(value) > limit:
                  raise SystemExit(f"{name} exceeds {limit} characters")

          if url:
              parsed = urlparse(url)
              if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                  raise SystemExit("url must be an absolute http(s) URL")

          payload = {"device_key": bark_key, "title": title, "body": body, "group": bark_group, "icon": icon_url}
          if url:
              payload["url"] = url
          Path("bark_payload.json").write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
          PY

      - name: Push to Bark
        if: steps.prepare.outputs.notify == 'true'
        run: |
          http_code=$(curl --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data-binary @bark_payload.json \
            "https://api.day.app/push" \
            --output bark_response.json \
            --write-out "%{http_code}")
          echo "Bark HTTP status: ${http_code}"
          echo "Bark response:"
          cat bark_response.json
          echo

      - name: Verify Bark response
        if: steps.prepare.outputs.notify == 'true'
        run: |
          python3 - <<'PY'
          import json
          with open("bark_response.json", "r", encoding="utf-8") as f:
              response = json.load(f)
          if response.get("code") != 200:
              raise SystemExit(f"Bark API rejected push: {response}")
          print("Bark API accepted notification.")
          PY

      - name: Delete transient notification comment
        if: always() && steps.prepare.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comment_id=$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          print((event.get("comment") or {}).get("id") or "")
          PY
          )
          if [ -z "${comment_id}" ]; then
            echo "Notification comment id is missing."
            exit 1
          fi
          curl --silent --show-error --fail \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"
          echo "Transient notification comment deleted."
